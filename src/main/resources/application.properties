spring.application.name=springweb

# 주석 : .propertis 파일의 주석 방법
# application.propertis 파일 : Spring 스프링 관련 설정 코드 입력하는 곳.
# 1. 내장 톰캣의 포트 번호 변경 , 기본값 = 8080
server.port = 8080
# 2. 데이터베이스 연동
# 2-1. 연동할 데이터베이스 주소
spring.datasource.url = jdbc:mysql://localhost:3306/mydb260902
# 2-2. 데이터베이스 주소의 계정명과 비밀번호
spring.datasource.username = root
spring.datasource.password = 1234