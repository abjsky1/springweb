<!--

    src -> main -> 자바파일(controller 등) = 서블릿 (동적서버/웹컨테이너)

        src -> main -> java -> example -> day036 -> BoardController -> @GetMapping("/board/findall")

    src -> main -> static(html/css/js 등) -> 정적서버/웹서버
    
        src -> main -> static -> day037 -> index.html 파일 생성

        통신경로 : http://127.0.0.1:8080/day037/index.html


    HTTP : 프로토콜/규약/규칙 , GET/POST/PUT/DELETE , http://ip:port/경로 

    HTTP 통신 방법/도구 :
